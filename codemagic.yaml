# 무서명 검증·등록 기기용 격리 서명·스토어 배포 빌드를 분리한다. 세 작업 모두 수동 실행이다.
# 스토어 작업(stiz-ios-app-store)은 TestFlight 업로드까지만 하고 심사 제출은 하지 않는다. 실행은 원장님 승인 후.
# 비밀값(API 키·인증서)은 이 파일에 쓰지 않는다 — Codemagic 팀 설정에 저장된 이름만 참조한다.
workflows:
  stiz-ios-simulator:
    name: STIZ 아이폰 앱 빌드 검증 (업로드 없음)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: 프로젝트 구성 확인
        script: |
          set -euo pipefail
          python3 apps/stiz-ios/tools/validate-project.py
          xcodebuild -list -project apps/stiz-ios/STIZ.xcodeproj
      - name: 실제 Swift 주소 정책 검사
        script: |
          set -euo pipefail
          swiftc apps/stiz-ios/STIZ/NavigationPolicy.swift \
            apps/stiz-ios/STIZ/NativeAuthPolicy.swift \
            apps/stiz-ios/tools/NavigationPolicyTests.swift -o /tmp/stiz-navigation-tests
          /tmp/stiz-navigation-tests
      - name: 아이폰 시뮬레이터용 무서명 빌드
        script: |
          set -euo pipefail
          xcodebuild -project apps/stiz-ios/STIZ.xcodeproj -scheme STIZ \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apps/stiz-ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: 시뮬레이터 앱 보관
        script: |
          set -euo pipefail
          cd apps/stiz-ios/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent STIZ.app STIZ-simulator.zip
    artifacts:
      - apps/stiz-ios/DerivedData/Build/Products/Debug-iphonesimulator/STIZ-simulator.zip
  stiz-ios-sandbox-adhoc:
    name: STIZ 등록 아이폰 격리 시험 앱 (스토어 업로드 없음)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - stiz_ios_sandbox_device
      ios_signing:
        provisioning_profiles:
          - profile: stiz-dasan-adhoc-sandbox-2026
            environment_variable: STIZ_SANDBOX_PROFILE
        certificates:
          - "BDR iOS App Store Distribution"
      vars:
        STIZ_SANDBOX_ORIGIN: "https://172.30.1.25:8453"
    triggering:
      events: []
    scripts:
      - name: 프로젝트와 수동 격리 구성 확인
        script: |
          set -euo pipefail
          python3 apps/stiz-ios/tools/validate-project.py
      - name: 실제 Swift 주소 정책 검사
        script: |
          set -euo pipefail
          swiftc apps/stiz-ios/STIZ/NavigationPolicy.swift \
            apps/stiz-ios/STIZ/NativeAuthPolicy.swift \
            apps/stiz-ios/tools/NavigationPolicyTests.swift -o /tmp/stiz-sandbox-navigation-tests
          /tmp/stiz-sandbox-navigation-tests
      - name: 등록 기기 일치 확인·격리 서명·IPA 검증
        script: |
          set -euo pipefail
          python3 apps/stiz-ios/tools/native_signed_sandbox.py build
    artifacts:
      - apps/stiz-ios/build/sandbox-device/STIZ-sandbox.ipa
      - apps/stiz-ios/build/sandbox-device/verification.json
  # 업턴랩스 App Store Connect API 키는 Codemagic 팀 설정 → Integrations 의 «bdr-asc-key»(업턴랩스 팀 키 — BDR 앱과 함께 씀, 원장 결정 2026-11-08)를 쓴다.
  # 배포 인증서는 Codemagic 팀 설정 → Code signing identities 에 둔다. 이 파일에는 이름만 있다.
  stiz-ios-app-store:
    name: STIZ 농구교실 App Store 배포 빌드·TestFlight 업로드 (수동·심사 제출 없음)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bdr-asc-key
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kr.co.upturnlabs.stizdasan
    triggering:
      events: []
    scripts:
      - name: 프로젝트 구성 확인
        script: |
          set -euo pipefail
          python3 apps/stiz-ios/tools/validate-project.py
      - name: 실제 Swift 주소 정책 검사
        script: |
          set -euo pipefail
          swiftc apps/stiz-ios/STIZ/NavigationPolicy.swift \
            apps/stiz-ios/STIZ/NativeAuthPolicy.swift \
            apps/stiz-ios/tools/NavigationPolicyTests.swift -o /tmp/stiz-store-navigation-tests
          /tmp/stiz-store-navigation-tests
      - name: 배포 서명 프로파일 적용
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Release 배포 빌드(IPA)
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project apps/stiz-ios/STIZ.xcodeproj \
            --scheme STIZ \
            --config Release \
            --archive-xcargs "CODE_SIGNING_ALLOWED=YES CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
