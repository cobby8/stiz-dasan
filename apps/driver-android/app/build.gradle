plugins { id 'com.android.application' }
def sandboxOption = providers.gradleProperty('stizSandbox').getOrElse('false')
if (!(sandboxOption in ['true', 'false'])) throw new GradleException('stizSandbox must be explicitly true or false')
def sandbox = sandboxOption == 'true'
def configuredOrigin = providers.gradleProperty('stizOrigin').getOrElse(sandbox ? 'https://localhost:8453' : 'https://www.stiz-dasan.kr')
def deviceTest = providers.gradleProperty('stizDeviceTest').getOrElse('false') == 'true'
// Local device-test commands keep the original isolated driver-only flow.
def unifiedApp = providers.gradleProperty('stizUnified').getOrElse(deviceTest ? 'false' : 'true') == 'true'
if (sandbox && (deviceTest || !unifiedApp)) throw new GradleException('Sandbox requires unified mode and cannot reuse the driver device-test package')
def originUri = new URI(configuredOrigin)
def localDevicePort = deviceTest && originUri.host == 'localhost' && originUri.port == 8443
def sandboxHost = originUri.host
def privateSandboxHost = sandboxHost == 'localhost'
if (sandboxHost != null && sandboxHost ==~ /(?:0|[1-9][0-9]{0,2})(?:\.(?:0|[1-9][0-9]{0,2})){3}/) {
    def parts = sandboxHost.split(/\./).collect { it.toInteger() }
    privateSandboxHost = parts.every { it <= 255 } && (parts[0] == 127 || parts[0] == 10 || (parts[0] == 172 && parts[1] >= 16 && parts[1] <= 31) || (parts[0] == 192 && parts[1] == 168))
}
def sandboxPort = sandbox && privateSandboxHost && originUri.port == 8453
if (originUri.scheme != 'https' || originUri.host == null || originUri.userInfo != null || originUri.query != null || originUri.fragment != null || !(originUri.path in ['', '/']) || (sandbox ? !sandboxPort : (!(originUri.port in [-1, 443]) && !localDevicePort))) throw new GradleException('stizOrigin must be one exact HTTPS origin; sandbox requires localhost/private IPv4:8453; driver device tests may use localhost:8443')
configuredOrigin = 'https://' + originUri.host + (sandboxPort ? ':8453' : localDevicePort ? ':8443' : '')
def localTlsDirectory = providers.gradleProperty('stizLocalTlsDir').orNull
if (sandbox && localTlsDirectory == null) throw new GradleException('Sandbox requires an explicit new sandbox public ca.crt directory via stizLocalTlsDir')
if (localTlsDirectory != null && !(sandboxPort || (originUri.host == 'localhost' && deviceTest))) throw new GradleException('Local TLS requires an explicit sandbox/private origin or localhost driver device test')
def localTlsOutput = layout.buildDirectory.dir('generated/localTlsDebug')
// ── 앱 알림(FCM, 2026-11-14 e2) ──────────────────────────────────────────────
// Firebase 콘솔에서 받은 app/google-services.json 이 «있을 때만» 알림을 켠다(파일은 git 에 넣지 않는다 — .gitignore).
// google-services 플러그인 대신 여기서 직접 읽어 BuildConfig 에 넣는 이유:
//  ① 파일이 없는 PC·CI 에서도 빌드가 깨지지 않는다(그때는 값이 비어 앱이 «알림 미지원»으로 동작)
//  ② 플러그인은 개발 빌드(kr.stiz.driver.unified 등) 패키지가 파일에 없으면 빌드를 멈춘다 — 여기서는 그 빌드만 알림이 꺼진다.
// 시험 앱(sandbox)·기사님 기기검증(deviceTest)은 바깥 통신을 하지 않으므로 항상 끈다.
def firebaseFile = file('google-services.json')
def firebaseClients = [:]
def firebaseProjectId = ''
def firebaseSenderId = ''
if (firebaseFile.exists()) {
    def parsed = new groovy.json.JsonSlurper().parse(firebaseFile)
    firebaseProjectId = (parsed.project_info?.project_id ?: '').toString()
    firebaseSenderId = (parsed.project_info?.project_number ?: '').toString()
    parsed.client?.each { client ->
        def pkg = client.client_info?.android_client_info?.package_name
        def appId = client.client_info?.mobilesdk_app_id
        def apiKey = client.api_key?.find { it.current_key }?.current_key
        if (pkg && appId && apiKey) firebaseClients[pkg.toString()] = [appId: appId.toString(), apiKey: apiKey.toString()]
    }
}
def firebaseField = { String packageName, String key ->
    def client = (sandbox || deviceTest || !unifiedApp) ? null : firebaseClients[packageName]
    def value = client == null ? '' : client[key]
    if (!(value ==~ /[A-Za-z0-9:_\-.]*/)) throw new GradleException('google-services.json 값 형식이 올바르지 않습니다')
    return '"' + value + '"'
}
def debugApplicationId = 'kr.stiz.driver' + (sandbox ? '.sandbox' : deviceTest ? '.devicetest' : unifiedApp ? '.unified' : '')
def generateLocalTls = null
if (localTlsDirectory != null) {
    def caFile = rootProject.file(localTlsDirectory).toPath().resolve('ca.crt').toFile()
    generateLocalTls = tasks.register('generateLocalTlsDebug') {
        inputs.file(caFile)
        inputs.property('sandbox', sandbox)
        inputs.property('origin', configuredOrigin)
        outputs.dir(localTlsOutput)
        doLast {
            // Read the public CA only. No server key or directory tree is copied.
            java.security.cert.X509Certificate certificate
            caFile.withInputStream { stream -> certificate = (java.security.cert.X509Certificate) java.security.cert.CertificateFactory.getInstance('X.509').generateCertificate(stream) }
            certificate.checkValidity()
            if (certificate.basicConstraints < 0) throw new GradleException('ca.crt must be a CA certificate')
            def output = localTlsOutput.get().asFile
            def raw = new File(output, 'res/raw'); raw.mkdirs()
            new File(raw, 'driver_test_ca.cer').bytes = certificate.encoded
            def xml = new File(output, 'res/xml'); xml.mkdirs()
            new File(xml, 'local_test_network_security.xml').text = '''<network-security-config>
    <base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="''' + (sandbox ? '@raw/driver_test_ca' : 'system') + '''" /></trust-anchors></base-config>
    <domain-config cleartextTrafficPermitted="false">
        <domain includeSubdomains="false">''' + originUri.host + '''</domain>
        <trust-anchors>''' + (sandbox ? '' : '<certificates src="system" />') + '''<certificates src="@raw/driver_test_ca" /></trust-anchors>
    </domain-config>
</network-security-config>'''
            new File(output, 'AndroidManifest.xml').text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
    <application android:label="''' + (sandbox ? 'STIZ 격리시험' : 'STIZ 기사님 기기검증') + '''" tools:replace="android:label" android:networkSecurityConfig="@xml/local_test_network_security">
        <activity android:name=".AttachmentFixtureActivity" android:exported="false" />
        <activity android:name=".NativeAuthReturnActivity" android:exported="true" android:noHistory="true" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="stiz-academy-android-dev" android:host="auth" android:path="/return" />
            </intent-filter>
        </activity>
    </application>
</manifest>'''
        }
    }
}
android {
    namespace 'kr.stiz.driver'
    compileSdk 36
    // 개발·시험 debug 는 기존 kr.stiz.driver(.unified/.sandbox/.devicetest)를 유지한다(시험 기기·격리 검사가 이 이름에 묶여 있다).
    // 스토어용 release 의 정식 ID 는 파일 끝 androidComponents 에서 정한다.
    defaultConfig { applicationId 'kr.stiz.driver'; minSdk 26; targetSdk 36; versionCode 6; versionName '1.0.3'; testInstrumentationRunner 'kr.stiz.driver.DriverSmokeInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'boolean', 'STIZ_UNIFIED_APP', unifiedApp.toString()
        resValue 'string', 'app_name', unifiedApp ? 'STIZ 농구교실' : 'STIZ 기사님'
        // 앱 알림(FCM) 프로젝트 값 — 설정 파일이 없으면 빈 값
        buildConfigField 'String', 'FCM_PROJECT_ID', '"' + (firebaseProjectId ==~ /[a-z0-9-]*/ ? firebaseProjectId : '') + '"'
        buildConfigField 'String', 'FCM_SENDER_ID', '"' + (firebaseSenderId ==~ /[0-9]*/ ? firebaseSenderId : '') + '"'
    }
    // 스토어 업로드 키(업턴랩스): 저장소 밖 파일에서만 읽는다(키·비밀번호를 git 에 넣지 않는다).
    // 파일이 없는 PC·CI 에서는 기존처럼 서명 없는 release 를 만든다.
    def uploadPropsFile = new File(providers.gradleProperty('stizUploadProperties')
        .getOrElse(System.getProperty('user.home') + '/.stiz-android/upload.properties'))
    if (uploadPropsFile.exists()) {
        def uploadProps = new Properties()
        uploadPropsFile.withInputStream { uploadProps.load(it) }
        signingConfigs {
            upload {
                storeFile new File(uploadProps.getProperty('storeFile'))
                storePassword uploadProps.getProperty('storePassword')
                keyAlias uploadProps.getProperty('keyAlias')
                keyPassword uploadProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'STIZ_SANDBOX', sandbox.toString()
            buildConfigField 'boolean', 'STIZ_NATIVE_AUTH', (!sandbox && providers.gradleProperty('stizNativeAuth').getOrElse('false') == 'true').toString()
            if (sandbox) { applicationIdSuffix '.sandbox'; resValue 'string', 'app_name', 'STIZ 격리시험' }
            else if (deviceTest) applicationIdSuffix '.devicetest'
            else if (unifiedApp) applicationIdSuffix '.unified'
            buildConfigField 'String', 'STIZ_ORIGIN', '"' + configuredOrigin + '"'
            // 개발 빌드는 그 패키지 이름이 google-services.json 에 등록돼 있을 때만 알림이 켜진다
            buildConfigField 'String', 'FCM_APP_ID', firebaseField(debugApplicationId, 'appId')
            buildConfigField 'String', 'FCM_API_KEY', firebaseField(debugApplicationId, 'apiKey')
        }
        // 앱 간편로그인(a1, 2026-11-13): 출시 빌드는 기능을 넣어 두고(복귀 주소 kr.co.upturnlabs.stizdasan, src/release 매니페스트),
        // 실제 사용 허용은 서버 스위치(NATIVE_AUTH_ENABLED)가 정한다. 기능 자체를 빼고 만들려면 -PstizReleaseNativeAuth=false.
        release { minifyEnabled false; if (uploadPropsFile.exists()) signingConfig signingConfigs.upload;buildConfigField 'boolean', 'STIZ_SANDBOX', 'false'; buildConfigField 'boolean', 'STIZ_NATIVE_AUTH', (providers.gradleProperty('stizReleaseNativeAuth').getOrElse('true') == 'true').toString(); buildConfigField 'String', 'STIZ_ORIGIN', '"https://www.stiz-dasan.kr"'
            // 스토어 앱(kr.co.upturnlabs.stizdasan)의 Firebase 앱 값 — Firebase 콘솔에 이 패키지 이름으로 등록해야 켜진다
            buildConfigField 'String', 'FCM_APP_ID', firebaseField('kr.co.upturnlabs.stizdasan', 'appId')
            buildConfigField 'String', 'FCM_API_KEY', firebaseField('kr.co.upturnlabs.stizdasan', 'apiKey') }
    }
    if (localTlsDirectory != null) {
        sourceSets {
            debug {
                manifest.srcFile localTlsOutput.get().file('AndroidManifest.xml').asFile
                res.srcDir localTlsOutput.get().dir('res').asFile
            }
        }
    }
}
if (generateLocalTls != null) tasks.configureEach { task -> if (task.name == 'preDebugBuild') task.dependsOn generateLocalTls }
// swiperefreshlayout: 화면을 아래로 당겨 새로고침(2026-11-13, 1.0.1)
// firebase-messaging: 앱 알림(FCM, 2026-11-14 e2) — 설정 파일이 없으면 들어만 있고 쓰이지 않는다
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; implementation 'androidx.core:core:1.16.0'; implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'; implementation 'com.google.firebase:firebase-messaging:24.1.0' }
// 스토어에 올리는 release 만 iOS 와 같은 정식 ID 를 쓴다(2026-11-05 원장님 결정).
// 기존 release(kr.stiz.driver)는 서명 없이 만들어져 어느 기기에도 설치된 적이 없으므로 바꿔도 기존 설치에 영향이 없다.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant -> variant.applicationId.set('kr.co.upturnlabs.stizdasan') }
}
